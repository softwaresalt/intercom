version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - unconvert
    - unparam
    - depguard
  settings:
    govet:
      settings:
        printf:
          funcs:
            - github.com/softwaresalt/intercom-go/internal/apperr.Newf
            - github.com/softwaresalt/intercom-go/internal/apperr.Wrapf
    depguard:
      rules:
        # 011.014-T (resolves 309FBF5A(ii)): the credential-consuming,
        # shell-executing Copilot SDK surface (NewClient, Client.Start,
        # CreateSession, SessionConfig.OnPermissionRequest) lives in the
        # ROOT package github.com/github/copilot-sdk/go, imported by the
        # adapter in internal/agent/copilot. Denying only the /rpc
        # subpackage (as a prior revision did) matches zero files and ships
        # as false
        # assurance. The root-prefix deny below subsumes /rpc.
        #
        # The allowlist exempts ONLY internal/agent/copilot (the single Copilot
        # SDK adapter, design §7.1) via depguard's negated,
        # absolute-path-anchored `files` form -- depguard evaluates `files`
        # against absolute paths, so a bare "internal/agent/copilot/*.go"
        # pattern (no leading "**/") would never match and would silently do
        # nothing. The allowlist is never widened to internal/** (design
        # §7.6); internal/copilotprobe was deleted by 057-S / 065.007-T.
        #
        # Ownership: depguard owns Go package-import boundaries; scripts/
        # check-retired-architecture.sh owns retired-architecture/path-
        # surface contamination -- the two are deliberately non-
        # overlapping gates.
        copilot-sdk-boundary:
          deny:
            - pkg: github.com/github/copilot-sdk/go
              desc: >-
                github.com/github/copilot-sdk/go (and its /rpc subpackage)
                is confined to internal/agent/copilot, the single
                anti-corruption-layer adapter (design 7.1). Production code
                must not import the Copilot SDK directly outside that package.
          files:
            - "$all"
            - "!**/internal/agent/copilot/*.go"

output:
  formats:
    text:
      path: stdout
