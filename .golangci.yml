version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - unconvert
    - unparam
  settings:
    govet:
      settings:
        printf:
          funcs:
            - github.com/softwaresalt/intercom-go/internal/apperr.Newf
            - github.com/softwaresalt/intercom-go/internal/apperr.Wrapf

output:
  formats:
    text:
      path: stdout
