version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - unconvert
    - unparam
    - depguard
  settings:
    govet:
      settings:
        printf:
          funcs:
            - github.com/softwaresalt/intercom-go/internal/apperr.Newf
            - github.com/softwaresalt/intercom-go/internal/apperr.Wrapf
    depguard:
      rules:
        # 011.014-T (resolves 309FBF5A(ii)): the credential-consuming,
        # shell-executing Copilot SDK surface (NewClient, Client.Start,
        # CreateSession, SessionConfig.OnPermissionRequest) lives in the
        # ROOT package github.com/github/copilot-sdk/go, imported by the
        # adapter in internal/agent/copilot. Denying only the /rpc
        # subpackage (as a prior revision did) matches zero files and ships
        # as false
        # assurance. The root-prefix deny below subsumes /rpc.
        #
        # The allowlist exempts ONLY internal/agent/copilot (the single Copilot
        # SDK adapter, design §7.1) via depguard's negated,
        # absolute-path-anchored `files` form -- depguard evaluates `files`
        # against absolute paths, so a bare "internal/agent/copilot/*.go"
        # pattern (no leading "**/") would never match and would silently do
        # nothing. The allowlist is never widened to internal/** (design
        # §7.6); internal/copilotprobe was deleted by 057-S / 065.007-T.
        #
        # Ownership: depguard owns Go package-import boundaries; scripts/
        # check-retired-architecture.sh owns retired-architecture/path-
        # surface contamination -- the two are deliberately non-
        # overlapping gates.
        copilot-sdk-boundary:
          deny:
            - pkg: github.com/github/copilot-sdk/go
              desc: >-
                github.com/github/copilot-sdk/go (and its /rpc subpackage)
                is confined to internal/agent/copilot, the single
                anti-corruption-layer adapter (design 7.1). Production code
                must not import the Copilot SDK directly outside that package.
          files:
            - "$all"
            - "!**/internal/agent/copilot/*.go"

        # 084.005-T (7EF4DA98): the transport is a leaf adapter. It consumes
        # hub, config and the agent contract, but must never reach up into the
        # application assembly or the TUI, nor down into the Copilot adapter
        # or SDK (the SDK is already confined by copilot-sdk-boundary; the
        # explicit deny here keeps the layering rule self-contained).
        transport-layering-boundary:
          deny:
            - pkg: github.com/softwaresalt/intercom-go/internal/app
              desc: internal/transport must not import internal/app (layering).
            - pkg: github.com/softwaresalt/intercom-go/internal/tui
              desc: internal/transport must not import internal/tui (layering).
            - pkg: github.com/softwaresalt/intercom-go/internal/agent/copilot
              desc: internal/transport must not import the Copilot adapter.
            - pkg: github.com/github/copilot-sdk/go
              desc: internal/transport must not import the Copilot SDK.
          files:
            - "**/internal/transport/**/*.go"

        # wsclient is the standalone reference client for the wire contract: it
        # must not import the server (transport, TUI, app, config, path helpers,
        # agent packages, SDK), so wire-constant drift between the two is caught
        # by conformance tests rather than hidden by a shared import. It may
        # import internal/hub for the envelope and cursor wire types only.
        wsclient-standalone-boundary:
          deny:
            - pkg: github.com/softwaresalt/intercom-go/internal/transport
              desc: wsclient must not import the server transport package.
            - pkg: github.com/softwaresalt/intercom-go/internal/tui
              desc: wsclient must stay standalone (no TUI).
            - pkg: github.com/softwaresalt/intercom-go/internal/app
              desc: wsclient must stay standalone (no app assembly).
            - pkg: github.com/softwaresalt/intercom-go/internal/config
              desc: wsclient must stay standalone (no server config).
            - pkg: github.com/softwaresalt/intercom-go/internal/pathsafe
              desc: wsclient must stay standalone (no server path helpers).
            - pkg: github.com/softwaresalt/intercom-go/internal/agent
              desc: wsclient must stay standalone (no agent packages).
            - pkg: github.com/github/copilot-sdk/go
              desc: wsclient must stay standalone (no Copilot SDK).
          files:
            - "**/internal/transport/wsclient/*.go"

        # Lower layers never depend on the transport that serves them.
        lower-layers-no-transport:
          deny:
            - pkg: github.com/softwaresalt/intercom-go/internal/transport
              desc: lower layers must not import internal/transport.
          files:
            - "**/internal/hub/**/*.go"
            - "**/internal/agent/**/*.go"
            - "**/internal/tui/**/*.go"
            - "**/internal/config/**/*.go"
            - "**/internal/pathsafe/**/*.go"

output:
  formats:
    text:
      path: stdout
