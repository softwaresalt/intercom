# secret-scan-history.yml
#
# Scheduled full-history secret scan (007.002-T / U2). Resolves stash
# 90350C9A.
#
# WHY A SEPARATE WORKFLOW: the per-PR scan at ci.yml's `security` job runs
# `gitleaks detect --source . --no-git -v` — working tree only, on every PR.
# That job is fast and cheap because it never walks history. It is left
# UNCHANGED by this workflow: this file complements it, it does not replace
# it. Committed history (already-merged commits) is never covered by the
# per-PR scan, so a secret merged before this repo had scanning at all — or
# introduced and then "fixed" in a later commit, leaving the original commit
# still exposed — would never be caught. This workflow closes that gap by
# scanning full git history on a schedule.
#
# NOT A PR-REQUIRED CHECK (deliberate, AC-6): a first-ever full-history scan
# can surface pre-existing findings from before this repo had any secret
# scanning. Wiring that into the PR-blocking path would halt all delivery on
# historical debt unrelated to the PR under review. This workflow only
# alerts; it never blocks a PR.
#
# DISCLOSURE CONTROLS (AC-5, NON-NEGOTIABLE): `--redact=100` is applied to
# every gitleaks invocation. The raw gitleaks JSON report is NEVER uploaded
# as a workflow artifact and NEVER printed in full. The redacted-summary and
# handoff-issue steps below extract ONLY RuleID, Fingerprint, the commit SHA,
# and the file path from each finding — the matched secret value itself is
# never included in any log, summary, or issue body.
#
# OPERATOR HANDOFF (AC-7): because scheduled/dispatch runs are unattended (no
# operator watching CI in real time), a finding is routed to a high-priority
# GitHub issue (a safe, review-free handoff surface — this workflow never
# writes to the backlog or pushes commits) requiring an explicit rotation
# decision, in addition to failing the job so the run is visibly red in the
# Actions tab.

name: Secret scan (full history)

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-history-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan-history:
    name: full-history secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      # Reuses the exact pinned, checksum-verified gitleaks install from
      # ci.yml's `security` job (version 8.30.1, full sha256) — written
      # literally here, not sourced from a shared variable, so this
      # workflow's provenance is independently auditable without
      # cross-referencing ci.yml.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Full-history scan: no --no-git (unlike the per-PR job), --redact=100
      # so no matched secret value ever reaches stdout/stderr, JSON report
      # written to a local, NEVER-uploaded file for the redaction step below
      # to parse.
      - name: gitleaks detect (full history, redacted)
        id: scan
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact=100 -v \
            --report-format json --report-path gitleaks-report.json \
            || echo "found=true" >> "$GITHUB_OUTPUT"

      # Extracts ONLY RuleID, Fingerprint, commit SHA, and file path from
      # each finding into the job summary. The matched secret value
      # (`Secret`/`Match` fields in gitleaks' JSON report) is deliberately
      # never read here.
      - name: Summarize findings (redacted metadata only)
        if: steps.scan.outputs.found == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Full-history secret scan — findings detected"
            echo
            echo "Metadata only (rule/fingerprint/commit/path); no matched value is ever recorded."
            echo
            echo '| Rule ID | Fingerprint | Commit | File |'
            echo '|---|---|---|---|'
            jq -r '.[] | "| \(.RuleID) | \(.Fingerprint) | \(.Commit) | \(.File) |"' gitleaks-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Operator handoff: a high-priority GitHub issue, not a backlog/stash
      # write and not a commit — this job never pushes to the repo. Body
      # contains the same redacted metadata as the job summary above.
      - name: Open high-priority handoff issue (redacted metadata only)
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "**High-priority: full-history secret scan found a match.**"
            echo
            echo "An explicit rotation decision is required. This scan runs with"
            echo "\`--redact=100\`; the matched secret value is never recorded"
            echo "anywhere in this issue, the job log, or any uploaded artifact."
            echo "Only rule/fingerprint/commit/path metadata is listed below."
            echo
            echo '| Rule ID | Fingerprint | Commit | File |'
            echo '|---|---|---|---|'
            jq -r '.[] | "| \(.RuleID) | \(.Fingerprint) | \(.Commit) | \(.File) |"' gitleaks-report.json
            echo
            echo "Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > issue-body.md
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "[SECURITY][HIGH-PRIORITY][BLOCKED] Full-history secret scan finding — rotation decision required" \
            --body-file issue-body.md

      - name: Fail on findings
        if: steps.scan.outputs.found == 'true'
        run: |
          echo "::error::Full-history secret scan found one or more matches. See the job summary and the handoff issue opened above. This job is NOT part of the PR-required check set (AC-6) and does not block delivery."
          exit 1
