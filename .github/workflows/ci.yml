# Generated by autoharness | Template: ci/ci.yml.tmpl
#
# Language-agnostic CI workflow implementing the unified CI + local-gating
# primitive (P-019). Four-job shape:
#   1. changes           — lightweight, ALWAYS runs, fail-closed path detection.
#   2. test — the expensive test/build gate; runs only when
#                          the fail-closed `changes` job detected a code change.
#   3. topology-check     — always-running pipeline-topology CI backstop (Gate
#                          C, P-001/P-016), required-vs-advisory via the
#                          `PIPELINE_TOPOLOGY_GATE_REQUIRED` repository variable.
#   4. ci gate — the always-running aggregation gate. This is
#                          the ONLY job a branch ruleset should require: it treats
#                          a skipped expensive job as OK and fails only when a
#                          needed job actually failed or was cancelled.
#
# Regular PR/push CI is Linux-only (ubuntu-latest); cross-OS verification is
# deferred to release-tag workflows. To run every PR across macOS/Windows,
# replace `runs-on: ubuntu-latest` with a matrix strategy (see the OS-matrix
# escape hatch documented in templates/ci/README.md).
#
# Actions are SHA-pinned. Refreshing pins is a periodic maintenance chore, not a
# per-change concern.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight always-running gate: decide whether the expensive pipeline needs
  # to run. Because this job always runs, a status is always reported while the
  # costly job below is skipped for changes that touch only docs/backlog files.
  #
  # predicate-quantifier: 'every' requires ALL patterns to match per file, so the
  # '!' negations actually exclude docs/markdown/backlog. Under the default 'some'
  # the leading '**' alone would mark every file matched and the negations would
  # never take effect (see dorny/paths-filter README) — a fail-OPEN bug. 'every'
  # makes any code/config/unknown-type change fail CLOSED into the expensive gate.
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Assert INTERCOM_LIVE_SDK_TESTS is not enabled in CI (011.002-T)
        # The live-SDK opt-in gate (internal/copilotprobe) must never be set
        # in any committed workflow file and must be unset in every job's
        # runtime environment -- ambient credentials must never silently
        # authorize a live Copilot SDK connection (and real shell execution)
        # in CI. Resolves A0A2D049's CI-assertion acceptance criterion.
        run: |
          set -euo pipefail
          if grep -R --include='*.yml' --include='*.yaml' -n 'INTERCOM_LIVE_SDK_TESTS' .github/workflows/; then
            echo "::error::INTERCOM_LIVE_SDK_TESTS must not appear in any committed workflow file"
            exit 1
          fi
          if [ -n "${INTERCOM_LIVE_SDK_TESTS:-}" ]; then
            echo "::error::INTERCOM_LIVE_SDK_TESTS must be unset in the CI runtime environment"
            exit 1
          fi
          echo "INTERCOM_LIVE_SDK_TESTS is absent from workflow config and unset in this job's environment."
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          predicate-quantifier: 'every'
          filters: |
            # Denylist: match any changed file that is NOT pure docs/backlog
            # state, so a code/config change can never silently skip the gate.
            code:
              - '**'
              - '!docs/**'
              - '!.backlogit/**'
              - '!.backlog/**'
              - '!.autoharness/**'

  # Expensive test/build gate. Runs only when the fail-closed `changes` job
  # detected a code/config change. Execution is gated SOLELY on the path result
  # so a code change can never bypass validation via the PR title — a `docs:` or
  # `chore:` title cannot skip the tests when code actually changed. Docs/backlog
  # -only PRs skip this job because `changes` reports `code == 'false'`.
  #
  # The job ID (`expensive`) is a fixed, valid GitHub Actions identifier; the
  # human-facing check context is `name: test`, which may
  # contain spaces/slashes. Job IDs may not, so the two are decoupled.
  expensive:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy (dirty-check)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go mod tidy dirtied tracked files - commit the result of 'go mod tidy'"
            exit 1
          fi
      - name: Build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        # -race requires cgo; leave CGO_ENABLED at the runner default here and
        # set CGO_ENABLED=0 only on the build/cross-compile steps above/below.
        run: go test -race -mod=readonly ./...

  # Advisory windows-latest verification job (011.009-T, resolves E89E5D00 +
  # DA945722): every other job runs ubuntu-latest, so isRooted's
  # leading-backslash rejection, hasPathPrefix/pathEqual case-folding,
  # stripUNCPrefix, and the junction-escape test never execute anywhere in CI.
  #
  # -race is deliberately OMITTED: windows-latest has no cgo, and -race fails
  # closed with exit 2 without it -- see
  # docs/compound/build-errors/go-race-requires-cgo-fails-closed-2026-09-03.md.
  #
  # Advisory-until-proven-green (011.010-T flips WINDOWS_GATE_REQUIRED to
  # 'true' after a documented green run with explicit operator confirmation --
  # see docs/compound / the shipment closure record for the flip decision).
  # continue-on-error is scoped to ONLY the test step, matching
  # topology-check's rationale above: a genuine setup/checkout/Go-install
  # failure always fails the job for real regardless of the toggle.
  #
  # 011.002-T is a hard precondition: without the default-deny opt-in gate in
  # internal/copilotprobe, `go test ./...` here would otherwise attempt real
  # Copilot SDK connections on a runner with no such credentials configured.
  #
  # LOCAL DIVERGENCE (ci.yml is autoharness-generated; re-apply this job after
  # regeneration until the OS-matrix escape hatch documented in this file's
  # header, lines 17-20, is applied upstream in the generating template).
  windows:
    name: test (windows, advisory)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Test (no -race — windows-latest has no cgo)
        continue-on-error: ${{ vars.WINDOWS_GATE_REQUIRED != 'true' }}
        run: go test -mod=readonly ./...

  # Format and lint gate (001.002.002-ST). Runs only when `changes` detected a
  # code/config change, matching `expensive`'s gating rationale above.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run retired-architecture gate
        continue-on-error: true
        run: bash scripts/check-retired-architecture.sh
      - name: Run retired-architecture self-test
        run: bash scripts/check-retired-architecture.sh --self-test
      - name: Run write-path-precondition self-test (011.004-T)
        run: bash scripts/check-write-path-precondition.sh --self-test
      - name: Install goimports (pinned)
        run: go install golang.org/x/tools/cmd/goimports@v0.49.0
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: goimports (3-group import order)
        run: |
          out="$(goimports -l .)"
          if [ -n "$out" ]; then
            echo "::error::goimports found unordered imports:"
            echo "$out"
            exit 1
          fi
      - name: Install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: golangci-lint run
        run: golangci-lint run ./...

  # Static analysis, vulnerability, and secret-scanning gate (001.002.003-ST).
  # All tool versions are PINNED (invariant I4) - never @latest - so an
  # upstream release cannot redden unrelated PRs.
  security:
    name: security
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install staticcheck (pinned)
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - name: staticcheck
        run: staticcheck ./...
      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck
        run: govulncheck ./...
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: gitleaks detect
        run: gitleaks detect --source . --no-git -v

  # .gitignore append-only invariant (I6) gate (007.006-T / U5). Runs on
  # `pull_request` only -- it needs `github.event.pull_request.base.sha`,
  # which does not exist on a `push` event. Full history (`fetch-depth: 0`)
  # is fetched on THIS JOB ONLY so the base SHA resolves; no other job's
  # checkout is slowed. Fails the job on a deletion or reorder (fail-closed
  # per scripts/check-gitignore-append-only.sh AC-4); an append-only PR
  # passes. Resolves stash F7C6420D (part 3 of 3).
  gitignore-append-only:
    name: gitignore append-only (I6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for base-ref resolution)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test the checker's own logic (regression guard)
        # Guards against a future edit to check-gitignore-append-only.sh
        # silently breaking the subsequence predicate: runs every
        # committed fixture (scripts/testdata/gitignore/) and fails the
        # job if any fixture's actual result no longer matches its
        # recorded expectation. Runs before the real invariant check below
        # so a broken checker is reported as "self-test failed", not
        # misread as a real .gitignore violation.
        run: bash scripts/check-gitignore-append-only.sh --self-test
      - name: Check .gitignore append-only (I6)
        run: |
          set -euo pipefail
          bash scripts/check-gitignore-append-only.sh \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.sha }}"

  # Loads the target matrix from scripts/targets.json (single source of
  # truth, shared with scripts/build.ps1 - 001.001.004-ST) so the CI matrix
  # below cannot drift from the local build script's target list.
  cross-compile-targets:
    name: load cross-compile targets
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.load.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Load targets.json
        id: load
        run: |
          set -euo pipefail
          targets="$(jq -c '.targets' scripts/targets.json)"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  # Cross-compile verification matrix (001.002.004-ST): asserts each of the 4
  # targets builds successfully with CGO_ENABLED=0 from a single ubuntu
  # runner. The target list is sourced from scripts/targets.json via the
  # cross-compile-targets job above, never redeclared inline here.
  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [changes, cross-compile-targets]
    if: needs.changes.outputs.code == 'true' && needs.cross-compile-targets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.cross-compile-targets.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in cmd/*/; do
            name=$(basename "$bin")
            go build -mod=readonly -o "dist/${name}-${GOOS}-${GOARCH}" "./cmd/${name}"
          done

  # Pipeline-topology CI backstop (Gate C, 109.014-T): the server-side
  # re-validation of the P-001 (at-most-one-active-shipment) / P-016 (single
  # implementation worktree/branch) invariants. Local hooks
  # (pre-commit-pipeline-topology.*, pre-push-quality-gates.*) are always
  # skippable via `git ... --no-verify`, and Git has no pre-worktree-add hook
  # at all -- CI closes that gap once a checkout syncs.
  #
  # THREAT MODEL / LIMITS: this job is NOT a non-bypassable backstop against a
  # malicious or compromised PR. GitHub's `pull_request` trigger (by design,
  # for contributor ergonomics) loads and runs THIS WORKFLOW FILE ITSELF from
  # the proposed PR head, so the same PR that violates topology invariants
  # can also edit this job (or ci-gate's needs/results aggregation below) to
  # trivially report success. What it DOES provide: a catch for
  # accidental/careless local bypasses that were never intended to touch the
  # enforcement workflow, and an ambient, non-shipment-scoped signal on every
  # push/PR from contributors who don't touch `.github/workflows/` or
  # `scripts/ci-topology-check.sh`. See "Threat Model & CODEOWNERS Hardening"
  # in docs/pipeline-topology-gate-ci-rollout.md for the recommended
  # mitigation (CODEOWNERS-required review on the enforcement surface) and a
  # stronger, out-of-scope alternative (`pull_request_target`).
  #
  # Always runs -- unlike `expensive`, this job is NOT gated on the `changes`
  # path-filter output: the ambient invocation is inexpensive and
  # non-shipment-scoped, and skipping it for docs/backlog-only changes would
  # leave exactly the commits most likely to touch `.backlog/` state (or legacy
  # `.backlogit/` state; both-roots-present must fail closed)
  # unchecked.
  #
  # REQUIRED-VS-ADVISORY is an explicit OPERATOR TOGGLE via the
  # `PIPELINE_TOPOLOGY_GATE_REQUIRED` repository variable: unset (default)
  # means advisory -- `continue-on-error: true` keeps the topology-verdict
  # STEP's reported result `success` for dependents (including `ci-gate`
  # below) even when the gate itself reports BLOCK. Setting the variable to
  # `'true'` flips `continue-on-error` to `false`, making a BLOCK verdict
  # fail this step (and therefore the job, and therefore `ci-gate`) for
  # real -- with NO WORKFLOW RE-RENDER NEEDED. See
  # docs/pipeline-topology-gate.md and docs/pipeline-topology-gate-ci-rollout.md
  # for the staged advisory->required rollout.
  #
  # NOTE (Copilot review, 2026-09-05): `continue-on-error` is scoped to ONLY
  # the topology-verdict step below, not the job as a whole. It previously
  # lived at the job level, which meant a genuine setup/checkout/install
  # failure (e.g. this job's own hash-pinned `pip install --require-hashes`
  # failing on a tampered/mismatched package) could ALSO be silently masked
  # as job-success whenever the advisory toggle is off -- undermining the
  # supply-chain-hardening signal U1 exists to provide. Scoping the toggle
  # to just the verdict step preserves the advisory/required rollout
  # semantics while ensuring setup/install failures always fail the job for
  # real, regardless of the toggle.
  topology-check:
    name: pipeline-topology (ambient)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install autoharness (hash-pinned, --require-hashes)
        # Hermetic install: every package in the full transitive closure is
        # pinned to an exact version AND verified against a committed
        # SHA-256 hash before pip will install it. --only-binary=:all:
        # additionally forecloses a fallback to building an unhashed sdist
        # via PEP 517 build isolation if a wheel is ever unavailable for
        # this platform/Python combination -- with --require-hashes alone,
        # that fallback path is a live unhashed-code-execution route pip
        # does not close by default. See
        # .github/constraints/autoharness-lock.txt for provenance and the
        # bump procedure. Resolves stash EFFAA358. This step is NEVER
        # covered by the advisory continue-on-error toggle below -- a hash
        # mismatch or install failure always fails the job for real.
        run: |
          pip install --require-hashes --only-binary=:all: -r .github/constraints/autoharness-lock.txt
      - name: Run CI topology-check entrypoint
        continue-on-error: ${{ vars.PIPELINE_TOPOLOGY_GATE_REQUIRED != 'true' }}
        run: bash scripts/ci-topology-check.sh

  # Always-reporting aggregation gate. REQUIRE THIS job in branch protection
  # instead of the guarded expensive job: when the expensive job is skipped for a
  # docs-only PR, GitHub reports it "skipped" — which a required
  # check treats as not-successful and would block the merge. This gate always
  # runs and passes unless a needed job actually failed or was cancelled.
  #
  # The job ID (`ci-gate`) is a fixed, valid GitHub Actions identifier. The
  # required-check context that a branch ruleset matches on is the reported
  # `name: ci gate`, which may contain spaces (e.g. `ci gate`)
  # — set ci gate to the exact name the ruleset already
  # requires so no ruleset edit is needed.
  ci-gate:
    name: ci gate
    if: always()
    needs: [changes, expensive, windows, lint, security, cross-compile-targets, cross-compile, topology-check, gitignore-append-only]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ needs.changes.result }} ${{ needs.expensive.result }} ${{ needs.windows.result }} ${{ needs.lint.result }} ${{ needs.security.result }} ${{ needs['cross-compile-targets'].result }} ${{ needs['cross-compile'].result }} ${{ needs['topology-check'].result }} ${{ needs['gitignore-append-only'].result }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not succeed: $r"
              exit 1
            fi
          done
          echo "All required jobs passed or were intentionally skipped."
