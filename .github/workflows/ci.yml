# `015.001-T` advisory window).
#
# Regular PR/push CI was Linux-only (ubuntu-latest) prior to 010-S; an
# advisory `windows-latest` job (`windows`, see the LOCAL DIVERGENCE note
# above) now also runs on every push/PR with a code change, gated
# non-blocking via `WINDOWS_GATE_REQUIRED` until proven green. To instead
# run every OS-matrix-eligible job (not just this one advisory job) across
