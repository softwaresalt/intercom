      description: "Schema contracts in config.yaml (1.1.0->1.3.0), workspace-profile.yaml (1.0.0->1.1.0), and harness-manifest.yaml (1.0.0->1.1.0) were known-legacy and referenced the retired agent-intercom capability pack."
      affected_artifacts:
