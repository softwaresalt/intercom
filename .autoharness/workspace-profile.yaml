# .autoharness/workspace-profile.yaml
schema_version: "1.1.0"
generated_at: "2026-10-24T19:30:18Z"
workspace_path: "C:\\Source\\GitHub\\intercom-go"

languages:
  primary: "Go"
  version: "1.25.0 (toolchain go1.26.9)"
  secondary:
    - "PowerShell"

frameworks:
  list:
    - "charmbracelet/bubbletea"
    - "charmbracelet/bubbles"
    - "charmbracelet/lipgloss"
    - "coder/websocket"
    - "github/copilot-sdk/go"
    - "spf13/cobra"
    - "BurntSushi/toml"
  mcp_sdk: null
  mcp_transport: null

primary_stack_pack: "api-service"
stack_packs:
  - "api-service"
  - "cli-tool"

build:
  tool: "go"
  command: "go build ./..."
  check_command: "go vet ./..."

test:
  runner: "go test"
  command: "go test ./..."
  directory: "inline (_test.go)"

lint:
  tool: "go vet"
  command: "go vet ./..."

format:
  tool: "gofmt"
  command: "gofmt -l -w ."

ci:
  platform: "GitHub Actions"
  pipeline_steps:
    - "changes"
    - "lint"
    - "test"
    - "build"
    - "topology-check"
    - "ci-gate"
  quality_gates:
    - "gofmt -l ."
    - "go vet ./..."
    - "go test ./..."
    - "go build ./..."
  required_check_name: "ci gate"
  linux_only: true
  path_filter_mode: "fail_closed_changes_job"
  docs_only_paths:
    - "docs/**"
    - ".backlogit/**"
    - ".autoharness/**"

local_gating:
  pre_push_enabled: true
  pre_push_gates:
    - "format"
    - "lint"
    - "test"
    - "build"

structure:
  source_layout: "Go layout: cmd/{intercom,intercom-ctl} entrypoints + internal/{agent,app,apperr,config,hub,pathsafe,transport,tui} packages + tools/gatecheck CLI"
  test_layout: "colocated _test.go unit tests + tests/integration/ cross-module/contract tests"
  doc_layout: "docs/ (closure/, compound/, decisions/, design-docs/, memory/, plans/, product-specs/)"

runtime_surfaces:
  cli: true
  web_ui: false
  public_api: true
  background_jobs: false
  browser_tooling: []
  deployment_manifests: []

runtime_validation:
  validator_manifest:
    surfaces:
      - surface: "cli"
        adapter_hint: "command"
        probe_hints:
          - id: "cli-smoke"
            kind: "command"
            target: "go run ./cmd/intercom --help (TUI/CLI cold-start / --help smoke)"
            command: "go run ./cmd/intercom --help"
            url: null
            route: null
            expected_signal: "process starts and prints usage without panic"
            required: true
            evidence_types:
              - "stdout"
              - "exit-code"
        manual_checkpoints:
          - id: "tui-render"
            label: "TUI renders and accepts local input"
            reason: "Bubble Tea TUI renders and accepts local key input without breaking terminal scrollback"
            required_for_release: true
            evidence_types:
              - "operator-note"
              - "screenshot"
      - surface: "api"
        adapter_hint: "http"
        probe_hints:
          - id: "ws-upgrade"
            kind: "http-request"
            target: "WebSocket upgrade on dynamically allocated WS port (e.g. 8081)"
            command: null
            url: "ws://127.0.0.1:8081/"
            route: "/"
            expected_signal: "101 Switching Protocols"
            required: true
            evidence_types:
              - "status-code"
              - "response-body"
          - id: "ws-keepalive"
            kind: "http-request"
            target: "ping/pong keep-alive holds the connection open during idle"
            command: null
            url: "ws://127.0.0.1:8081/"
            route: "/"
            expected_signal: "pong received within keep-alive interval"
            required: false
            evidence_types:
              - "log-line"
        manual_checkpoints:
          - id: "devtunnel-connect"
            label: "Dev Tunnel remote connect"
            reason: "Dev Tunnel registration succeeds and an authenticated remote client can connect"
            required_for_release: true
            evidence_types:
              - "operator-note"
              - "external-confirmation"
          - id: "tool-approval-routing"
            label: "Tool-approval first-responder routing"
            reason: "Tool-approval routing (first-responder lock) resolves across local TUI and remote client"
            required_for_release: true
            evidence_types:
              - "operator-note"
              - "audit-log"
  validation_expectations:
    required: true
    surfaces_expected:
      - "cli"
      - "api"
    minimum_verdict: "PASS_WITH_FOLLOW_UP"
    preserve_invariants:
      - "SessionState hydration replays full history to late-joining clients"
      - "ActiveToolCall lock prevents duplicate tool approvals"
    release_blockers:
      - "WebSocket server fails to accept authenticated upgrades"
      - "TUI panic on polymorphic ACP payload decode"
  releasability:
    required: true
    status_when_satisfied: "READY_WITH_CONDITIONS"
    required_evidence:
      - kind: "healthy-signal"
        required: true
        description: "CLI/TUI smoke evidence (cold-start + --help without panic)"
      - kind: "healthy-signal"
        required: true
        description: "WebSocket connect + hydrate + tool-approval evidence"

conventions:
  code_style:
    formatter: "gofmt"
    editorconfig: false
    markdownlint: true
    markdownlint_config: null
  git:
    default_branch: "main"
    branch_naming: "not enforced (recommend feature branches, e.g. chore/autoharness-install-<date>)"
    commit_style: "not enforced"
    pr_template: false
    issue_templates: false
    submodules:
      - "references -> https://github.com/ogulcancelik/herdr.git"
  documentation:
    readme: true
    adrs: "docs/decisions/"
    design_docs: "docs/design-docs/"
    changelog: false

tools:
  markdownlint: true
  markdownlint_config: null

harness_recommendations:
  preset: "full"
  capability_packs:
    - "agent-engram"
    - "graphtor-docs"
    - "backlogit"
    - "browser-verification"
    - "continuous-learning"
    - "strict-safety"
    - "release-observability"
    - "adversarial-review"
  install_layers:
    - "foundation"
    - "instructions"
    - "workflow"
    - "review"
    - "runtime"
    - "backlog"
    - "knowledge"
    - "overlays"
  recommendation_reasons:
    preset:
      - "Operator explicitly requested a full capability-pack install."
      - "Backend service with concurrent TUI + networked WebSocket surfaces and remote-operator approval flow warrants the full pipeline, review, runtime, and knowledge layers."
    capability_packs:
      - item: "agent-engram"
        because: "Engram MCP server is configured and an active .engram/ index exists."
        signals:
          - ".mcp.json engram server (stdio)"
          - ".engram/config.toml, .engram/registry.yaml, .engram/code-graph/"
          - ".github/copilot-instructions.md contains <!-- engram:start --> markers"
      - item: "graphtor-docs"
        because: "graphtor-docs MCP server is configured with a materialized local index and binary."
        signals:
          - ".mcp.json graphtor-docs server"
          - ".graphtor/config/sources.yaml"
          - ".graphtor/bin/graphtor-docs.exe"
      - item: "backlogit"
        because: "backlogit is the detected backlog tool with MCP + CLI available and advanced features enabled."
        signals:
          - ".backlogit/config.yaml"
          - ".mcp.json backlogit server"
          - "backlogit CLI on PATH"
      - item: "browser-verification"
        because: "Requested as part of full install; no browser tooling detected yet, so the pack is composed but inert until a browser runner is added."
        signals:
          - "operator requested full capability-pack set"
      - item: "continuous-learning"
        because: "Requested as part of full install; adds observe/learn/evolve knowledge loop."
        signals:
          - "operator requested full capability-pack set"
      - item: "strict-safety"
        because: "Networked WebSocket API surface with OAuth/identity-gated Dev Tunnel access and remote tool-approval routing are high-blast-radius, security-sensitive surfaces."
        signals:
          - "runtime_surfaces.public_api == true (coder/websocket server)"
          - "design mandates identity gating (--allow-anonymous false, GitHub OAuth token validation)"
      - item: "release-observability"
        because: "Requested as part of full install; service is spawned per-workspace with slog telemetry and Dev Tunnel registration that benefit from monitoring/rollback framing."
        signals:
          - "operator requested full capability-pack set"
          - "design references structured slog telemetry"
      - item: "adversarial-review"
        because: "Requested as part of full install; concurrency (goroutine/channel hub) and polymorphic protocol decoding warrant adversarial review personas."
        signals:
          - "operator requested full capability-pack set"
          - "channel-based Hub concurrency and JSON-RPC union-type decoding"
    install_layers:
      - item: "foundation"
        because: "Constitution + AGENTS.md baseline for every install."
      - item: "instructions"
        because: "Go, commit, markdown, git, PR, and style instruction files."
      - item: "workflow"
        because: "Stage/Ship pipeline agents and core skills for the full preset."
      - item: "review"
        because: "Review orchestrators and personas (full preset + adversarial-review pack)."
      - item: "runtime"
        because: "CLI + WebSocket API runtime surfaces require runtime-verification and operational-closure."
      - item: "backlog"
        because: "backlogit is the detected backlog tool and drives queue/archive workflows."
      - item: "knowledge"
        because: "compound docs + continuous-learning knowledge loop."
      - item: "overlays"
        because: "strict-safety and release-observability overlays woven into pipeline and review."

agent_engram:
