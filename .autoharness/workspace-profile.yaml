        - ".autoharness/workspace-profile.yaml"
        - ".autoharness/harness-manifest.yaml"
    - category: "degrading"
      description: "Pipeline agents (_orchestrator, _stage, _ship) omitted required P-013.4/P-013.5 model_family/model_provider/reasoning_effort/context_tier frontmatter keys, and all 16 subagents had stale install-time route frontmatter relative to operator config."
      affected_artifacts:
        - ".github/agents/_orchestrator.agent.md"
        - ".github/agents/_stage.agent.md"
        - ".github/agents/_ship.agent.md"
        - ".github/agents/subagents/"
    - category: "degrading"
      description: "Stage escalation route had no nested override and resolved to the same (gemini-4-argon, google, high) tuple as Stage's role route (ESCALATION_DEGRADED)."
      affected_artifacts:
        - ".autoharness/config.yaml"
        - ".github/agents/_stage.agent.md"
    - category: "degrading"
      description: "workflow-policies.md P-017 lacked the Dark Factory Visibility Protocol table and backlog-registry.yaml lacked CLI hook commands."
      affected_artifacts:
        - ".github/policies/workflow-policies.md"
        - ".autoharness/backlog-registry.yaml"
    - category: "degrading"
      description: "Workspace uses legacy .backlogit/ storage root (.backlog/ absent); detect-and-report advisory for backlogit migrate --workspace-dir --dry-run."
      affected_artifacts:
        - ".backlogit/"
    - category: "growth"
      description: "Go language floor evolved from 1.21+ to 1.25.0 (toolchain go1.26.9) and dependencies replaced coder/acp-go-sdk and gorilla/websocket with github/copilot-sdk/go and coder/websocket."
      affected_artifacts:
        - "AGENTS.md"
        - ".github/copilot-instructions.md"
        - ".github/instructions/constitution.instructions.md"
  checksum_scan:
    manifest_present: true
    ignore_file: null
    checked_artifacts: 106
    missing_count: 0
    user_modified_count: 28
    ignored_count: 0
  recommendations:
