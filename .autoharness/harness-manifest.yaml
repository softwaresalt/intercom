variables_used:
  LANGUAGE_VERSION_DETAIL: Go 1.21+ (modules; standard `cmd/` + `internal/` layout)
  LANGUAGE_FILE_GLOB: '**/*.go'
  FILE_EXT: go
  UNIMPLEMENTED_MARKER: 'panic("not implemented: <reason>")'
  NAMING_RULES: Use MixedCaps / mixedCaps (never snake_case). Exported identifiers start with an uppercase letter; unexported stay lowercase. Keep package names short, lowercase, and free of underscores. Acronyms keep a consistent case (`ID`, `URL`, `HTTP`). Interface names for single-method interfaces end in `-er` (e.g. `Reader`).
  CODE_ORGANIZATION_RULES: Command entrypoints live under `cmd/<binary>/`; reusable but non-public code lives under `internal/`. Keep packages cohesive and dependency-directed (no import cycles). One responsibility per package; avoid `util`/`common` grab-bags. Keep files focused and grouped by concern.
  ERROR_HANDLING_RULES: 'Return `error` as the last value and handle it explicitly — never discard with `_` unless justified. Wrap with `fmt.Errorf("...: %w", err)` to preserve the chain; inspect with `errors.Is` / `errors.As`. Do not `panic` for ordinary/recoverable conditions. Reserve `panic` for truly unrecoverable programmer errors and `recover` only at well-defined boundaries (e.g. a goroutine supervisor).'
  SAFETY_RULES: Avoid `unsafe` and `reflect` unless there is no safe alternative, and justify any use in a comment. Guard all shared mutable state with a mutex or confine it to a single owning goroutine; validate with `go test -race`. Always `defer` cleanup (Close/Unlock) next to acquisition. Propagate `context.Context` for cancellation and never store one in a struct.
  PERFORMANCE_RULES: Preallocate slices/maps with a known capacity; avoid needless allocations in hot paths. Pass large structs by pointer; keep value receivers for small immutable types. Stream with `io.Reader`/`io.Writer` instead of buffering whole payloads. Benchmark with `testing.B` before optimizing; bound goroutine fan-out and channel buffers.
  TESTING_RULES: Write table-driven tests in `_test.go` files beside the code under test. Use subtests via `t.Run`; prefer `testing` + standard library over heavy frameworks. Run `go test ./...` and `go test -race ./...` for concurrent code. Keep tests deterministic and hermetic (no network/time flakiness).
  DOCUMENTATION_RULES: Every exported identifier has a GoDoc comment beginning with the identifier name (`// Foo does ...`). Document package purpose in a `doc.go` or the primary file. Keep comments explaining *why*, not *what*. Run `gofmt` and `go vet` so docs and code stay consistent.
  DEPENDENCY_RULES: Manage dependencies with Go modules (`go.mod`/`go.sum`); pin versions and run `go mod tidy`. Prefer the standard library; add third-party modules only with clear justification. Vet new dependencies for maintenance and license. Keep the dependency graph shallow.
  ANTI_PATTERNS: Ignoring returned errors; naked `panic` for control flow; unbounded goroutine spawning without lifecycle control; sharing memory without synchronization; `interface{}`/`any` where a concrete type fits; package-level mutable global state; blocking on channels without a `select`/`context` escape; `init()` side effects that hide ordering.
  LANGUAGE_SAFETY_CHECKS: '- `unsafe`/`reflect` used without justification

    - Shared mutable state accessed without a mutex or channel ownership (data race)

    - Missing `defer` for `Close`/`Unlock`, or cleanup that can be skipped on an error path

    - `context.Context` not propagated for cancellable/blocking operations

    - Goroutines started without a clear termination/lifecycle path (leak)'
  LANGUAGE_IDIOM_CHECKS: '- Non-idiomatic naming (snake_case, stuttering like `http.HTTPClient`)

    - `interface{}`/`any` where a concrete type or generic constraint fits

    - Returning bare `error` strings instead of wrapped/sentinel errors

    - Accept-interfaces / return-structs violated; oversized interfaces

    - Value vs pointer receiver chosen inconsistently across a type''s methods'
  LANGUAGE_ERROR_HANDLING_CHECKS: '- Errors ignored via `_` or dropped without handling/logging

    - Wrapping loses the chain (`%v` instead of `%w`) so `errors.Is/As` fails

    - `panic` used for ordinary recoverable conditions

    - Error checked but the happy path still executes

    - Sentinel errors compared with `==` instead of `errors.Is`'
  LANGUAGE_PERFORMANCE_CHECKS: '- Slices/maps grown in a loop without preallocated capacity

    - Large structs copied by value on hot paths

    - Whole payloads buffered where an `io.Reader`/`io.Writer` stream fits

    - Unbounded goroutine fan-out or unbuffered channels causing contention

    - Repeated allocations in hot loops that escape to the heap'
  QUALITY_GATE_1_NAME: Format
  QUALITY_GATE_1: gofmt -l . (no output) and `gofmt -w .` applied
  QUALITY_GATE_2_NAME: Vet / Lint
  QUALITY_GATE_2: go vet ./... passes with no findings
  QUALITY_GATE_3_NAME: Test
  QUALITY_GATE_3: go test ./... (and `go test -race ./...` for concurrent code) passes
  QUALITY_GATE_4_NAME: Build
  QUALITY_GATE_4: go build ./... compiles cleanly
